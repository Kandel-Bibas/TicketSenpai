name: Bug report
description: Something in TicketSenpai does not work as documented.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please check the [troubleshooting guide](https://github.com/Kandel-Bibas/TicketSenpai/blob/main/docs/troubleshooting.md) and [existing issues](https://github.com/Kandel-Bibas/TicketSenpai/issues?q=is%3Aissue) first.

        **Security problems must not be reported here.** See [SECURITY.md](https://github.com/Kandel-Bibas/TicketSenpai/blob/main/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Start from a fresh database (`make reset CONFIRM=reset`) if you can.
      placeholder: |
        1. make reset CONFIRM=reset && make dev
        2. Sign in as alice@example.test
        3. Open /events/1 and select seat A-1-1
        4. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: API error `code` and `message`, browser console output, or terminal output from `make dev`.
      render: text
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Setup / make targets
        - Accounts and sessions
        - Events and search
        - Seat map and holds
        - Checkout and tickets
        - Reviews
        - Admin
        - Reference mock (src/, web/, test/)
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, Windows 11 + WSL
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Node.js and Python versions
      placeholder: "node v22.11.0, Python 3.12.7"
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this has not been reported.
          required: true
        - label: This is not a security vulnerability.
          required: true
