name: Feature request
description: Suggest an improvement to TicketSenpai.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        TicketSenpai is a local, single-machine learning project. Requests that need real payments, real personal data, or a production deployment are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Include API or UI sketches if useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: impact
    attributes:
      label: This change would affect
      options:
        - label: The database schema (requires `make reset CONFIRM=reset`)
        - label: The HTTP API
        - label: Authentication, sessions, or access control
        - label: Dependencies
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
